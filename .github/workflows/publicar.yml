# Publica una versión de Minuta sola: basta con subir el número de versión en app/Info.plist (y escritorio/package.json)
# y hacer push a main. Compila Mac, Windows y Linux, arma cada descarga con su huella SHA-256 y crea el Release vX.Y.Z;
# las apps instaladas lo ven en su próxima revisión (al abrir y cada 6 h) y muestran el aviso dentro de la app.
# También sirve subir una etiqueta v* o lanzarlo a mano. Si la versión ya está publicada, no hace nada.
# (Si Actions no está disponible, se hace a mano: ver "Publicar una versión" en AGENTS.md.)
name: Publicar versión
on:
  push:
    branches: [main]
    paths: ["app/Info.plist"]
    tags: ["v*"]
  workflow_dispatch:
# Permisos mínimos: todo lee; solo el último paso (crear el Release) puede escribir.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - name: Pruebas rápidas (no se publica una versión rota)
        run: python3 pruebas/contrato.py && python3 pruebas/test_python.py
      - id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=$(python3 -c "import plistlib;print(plistlib.load(open('app/Info.plist','rb'))['CFBundleShortVersionString'])"); fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"; echo "v$V ya está publicada: nada que hacer."
          else echo "publicar=true" >> "$GITHUB_OUTPUT"; echo "Se publicará v$V"; fi

  macos:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - name: Versión en Info.plist
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" app/Info.plist
      - name: Empaquetar
        run: bash herramientas/empaquetar.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: "dist/Minuta-macOS.zip*" }

  windows-linux:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    # Ambos se arman desde Linux: whisper se compila con zig y el instalador de Windows con makensis (sin Wine).
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: escritorio } }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y nsis cmake && python3 -m pip install --user --break-system-packages "ziglang==0.17.0"  # igual que ZIG_VER en herramientas/preparar.sh
      - name: Versión
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      # Exactamente lo del package-lock.json y sin scripts de instalación (.npmrc: ignore-scripts).
      - run: npm ci --ignore-scripts
      - name: Linux (AppImage y tar.gz)
        run: |
          bash herramientas/preparar.sh linux
          npx electron-builder --linux AppImage tar.gz
          (cd dist && sha256sum Minuta-Linux.AppImage > Minuta-Linux.AppImage.sha256 && sha256sum Minuta-Linux.tar.gz > Minuta-Linux.tar.gz.sha256)
      - name: Windows (instalador)
        run: |
          bash herramientas/preparar.sh windows
          npx electron-builder --win dir
          bash herramientas/instalador-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: escritorio, path: "escritorio/dist/Minuta-*" }

  release:
    needs: [version, macos, windows-linux]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: descargas, merge-multiple: true }
      - name: Crear el Release
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ needs.version.outputs.version }}" }
        run: |
          V="v$VERSION"
          gh release create "$V" descargas/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Minuta $V" --generate-notes
